name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run TypeScript type checking
      run: npm run typecheck

    - name: Run lint
      run: npm run lint

    - name: Run tests
      run: npm run test
      
    # These builds only prove the extension still compiles, so they skip the
    # OAuth credential check rather than exposing the secrets to fork pull
    # requests. Artifacts from here cannot sign in and must never be released;
    # releases are built, signed and published locally by
    # jeff_stuff/firefox_rebuild/rebuild.sh, which has the real credentials.
    - name: Build Chrome extension
      env:
        ALLOW_MISSING_OAUTH_CREDENTIALS: '1'
      run: npm run build:chrome

    - name: Build Firefox extension
      env:
        ALLOW_MISSING_OAUTH_CREDENTIALS: '1'
      run: npm run build:firefox

    - name: Check build artifacts
      run: |
        echo "Chrome build contents:"
        ls -la dist/chrome/
        echo "Firefox build contents:"
        ls -la dist/firefox/
        
    - name: Validate manifests
      run: |
        echo "Chrome manifest:"
        cat dist/chrome/manifest.json
        echo "Firefox manifest:"
        cat dist/firefox/manifest.json
        
    - name: Upload Chrome build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension-${{ matrix.node-version }}
        path: dist/chrome/
        
    - name: Upload Firefox build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firefox-extension-${{ matrix.node-version }}
        path: dist/firefox/
