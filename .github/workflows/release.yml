name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run type checking
      run: npm run typecheck
      
    - name: Build Chrome extension
      env:
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      run: npm run build:chrome

    - name: Build Firefox extension
      env:
        FIREFOX_CLIENT_ID: ${{ secrets.FIREFOX_CLIENT_ID }}
        FIREFOX_CLIENT_SECRET: ${{ secrets.FIREFOX_CLIENT_SECRET }}
      run: npm run build:firefox

    - name: Create Chrome extension package
      run: |
        cd dist/chrome
        zip -r ../../grab-otp-chrome-${{ github.ref_name }}.zip .
        cd ../..
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        if [ -f CHANGELOG.md ]; then
          awk "/^## \[${{ github.ref_name }}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md
        else
          echo "Release ${{ github.ref_name }}"
          echo ""
          echo "### Changes"
          echo "- Bug fixes and improvements"
        fi >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body: |
          # Grab OTP ${{ github.ref_name }}
          
          Cross-browser extension for automatically retrieving OTP codes from Gmail.
          
          ## Downloads
          - **Chrome**: Download `grab-otp-chrome-${{ github.ref_name }}.zip`
          - **Firefox**: Download the `.xpi` file
          
          ## Installation
          **Chrome:**
          1. Download the ZIP file
          2. Unzip the extension files
          3. Load as unpacked extension in developer mode (`chrome://extensions/`)
          
          **Firefox:**
          1. Download the `grab_otp-*.xpi` file
          2. Open Firefox and drag the file into the browser, or go to `about:addons` -> ⚙️ -> Install Add-on From File...

          Already running Grab OTP on Firefox? You don't need to do anything — Firefox
          checks for new versions daily and will offer this one under Available Updates.
          
          ## Changes
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ---
          
          **Note**: Store versions pending review. Manual installation available above.
        files: |
          grab-otp-chrome-${{ github.ref_name }}.zip
        draft: false
        prerelease: false
