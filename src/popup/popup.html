<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grab OTP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>🔐 Grab OTP</h1>
  </div>

  <!-- Account Selector -->
  <div class="account-selector">
    <div id="accountRow" class="account-row">
      <span id="accountEmail" class="account-email no-account">No account connected</span>
      <button id="accountDropdownToggle" class="account-dropdown-toggle" title="Switch account">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
    </div>
    <div id="accountDropdown" class="account-dropdown" style="display: none;">
      <div id="accountList"></div>
      <button id="addAccountBtn" class="add-account-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Gmail Account
      </button>
    </div>
  </div>

  <div id="updateBanner" class="update-banner" style="display: none;">
    <strong>Update Available!</strong>
    <span id="updateMessage"></span>
    <a href="https://github.com/jefe-johann/grab-otp/releases/latest" target="_blank">Download Update</a>
  </div>

  <div id="status" class="status" style="display: none;"></div>

  <button id="grabOTP" class="grab-button">
    Get OTP from Gmail
  </button>

  <button id="grabSMS" class="grab-button grab-button-secondary" style="display: none;">
    Grab SMS code
  </button>

  <div class="domain-row">
    <span id="currentDomain" class="current-domain"></span>
    <button id="settingsToggle" class="settings-toggle" title="Domain settings">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>

  <div id="domainOverridePanel" class="domain-override-panel" style="display: none;">
    <label class="override-label">Search emails from:</label>
    <div class="override-input-row">
      <input type="text" id="overrideDomain" class="override-input" placeholder="e.g., example.com">
      <button id="clearOverride" class="clear-override-btn">Clear</button>
    </div>
    <div id="overrideStatus" class="override-status"></div>
  </div>

  <div class="settings">
    <label class="checkbox-container">
      <input type="checkbox" id="autoFillEnabled" checked>
      <span class="checkbox-label">Auto-fill OTP code</span>
    </label>
    <label class="checkbox-container">
      <input type="checkbox" id="smsEnabled">
      <span class="checkbox-label">Enable SMS code grabbing</span>
    </label>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
